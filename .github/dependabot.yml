version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        update-types:
          - minor
          - patch

  # Dependabot matches any filename containing "Dockerfile", so it picks up the FROM lines in Dockerfile.j2
  - package-ecosystem: docker
    directory: /playbooks/docker
    schedule:
      interval: weekly
    ignore:
      # Majors move to a new JDK release (often non-LTS); upgrade those deliberately alongside the toolchain
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
      # The runtime stage's base must match the Ubuntu release the Temurin images use (glibc); bump it by hand with
      # them rather than to every new tag (26.10 etc. are non-LTS)
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
