plugins {
    id 'application'
    id 'jacoco'
    id 'checkstyle'
    alias(libs.plugins.versions)
    alias(libs.plugins.spotbugs)
}

group = 'com.ruchij'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor libs.javalin.openapi.annotation.processor

    implementation(
        libs.javalin.bundle,
        libs.typesafe.config,
        libs.logback.classic,
        libs.logstash.logback.encoder,
        libs.jackson.datatype.jdk8,
        libs.javalin.openapi.plugin,
        libs.javalin.swagger.plugin
    )

    testImplementation(
        platform(libs.junit.bom),
        libs.junit.jupiter,
        libs.junit.platform.launcher,
        libs.mockito.core
    )
}

application {
    mainClass = 'com.ruchij.App'
    applicationDefaultJvmArgs = [
        '-Dlogback.configurationFile=/opt/data/logback.xml'
    ]
}

def generatedSourcesDirectory = layout.buildDirectory.dir("generated/src/main/java")

def gitOutput = { List<String> arguments, String fallback ->
    providers.exec {
        commandLine(['git'] + arguments)
        ignoreExitValue = true
    }.standardOutput.asText.map { it.trim() ?: fallback }
}

// Every input is derived from the checked-out commit (BUILD_TIMESTAMP is the commit time, not the wall clock), so
// the task, compileJava and test stay up-to-date and cacheable until HEAD moves.
def generateBuildInfo = tasks.register("generateBuildInfo") {
    def applicationGroup = project.group.toString()
    def gradleVersion = gradle.gradleVersion
    def gitBranch = gitOutput(['rev-parse', '--abbrev-ref', 'HEAD'], 'unknown')
    def gitCommit = gitOutput(['rev-parse', '--short', 'HEAD'], 'unknown')
    def gitCommitEpochSeconds = gitOutput(['log', '-1', '--format=%ct'], '0')

    inputs.property("applicationGroup", applicationGroup)
    inputs.property("gradleVersion", gradleVersion)
    inputs.property("gitBranch", gitBranch)
    inputs.property("gitCommit", gitCommit)
    inputs.property("gitCommitEpochSeconds", gitCommitEpochSeconds)
    outputs.dir(generatedSourcesDirectory)

    doLast {
        def buildInfoFile = generatedSourcesDirectory.get().file("com/ruchij/build/BuildInfo.java").asFile
        buildInfoFile.parentFile.mkdirs()

        buildInfoFile.text = """
            package com.ruchij.build;

            import java.time.Instant;

            public final class BuildInfo {
                public static final String APPLICATION_NAME = "javalin-seed";
                public static final String APPLICATION_GROUP = "${applicationGroup}";
                public static final String GRADLE_VERSION = "${gradleVersion}";
                public static final Instant BUILD_TIMESTAMP = Instant.ofEpochSecond(${gitCommitEpochSeconds.get()}L);
                public static final String GIT_BRANCH = "${gitBranch.get()}";
                public static final String GIT_COMMIT = "${gitCommit.get()}";
            }
        """.stripIndent()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

sourceSets {
    main {
        java {
            // Passing the task (not just the directory) also makes compileJava depend on it
            srcDir(generateBuildInfo)
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// The generated BuildInfo class holds only constants; keep it out of the coverage numbers.
def jacocoExcludes = ['com/ruchij/build/**']

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

distTar {
    archiveFileName = 'api.tar'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
    classDirectories.setFrom(classDirectories.files.collect { fileTree(it) { exclude jacocoExcludes } })
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(classDirectories.files.collect { fileTree(it) { exclude jacocoExcludes } })
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

spotbugs {
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}