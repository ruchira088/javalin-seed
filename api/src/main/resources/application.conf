
http {
    port = 8080
    port = ${?HTTP_PORT}

    # Local front-end dev servers; deployed environments replace this via HTTP_ALLOWED_ORIGINS
    allowed-origins = "http://localhost:3000,http://localhost:5173"
    allowed-origins = ${?HTTP_ALLOWED_ORIGINS}

    # Whether CORS responses carry Access-Control-Allow-Credentials. Off by default: with wildcard origins it would let
    # any matching subdomain make cookie-bearing requests. Enable only once the API actually authenticates by cookie.
    allow-credentials = false
    allow-credentials = ${?HTTP_ALLOW_CREDENTIALS}
}

management {
    # Serves /metrics. Kept off the public port: the K8s Service and Ingress only expose http.port
    port = 9090
    port = ${?MANAGEMENT_PORT}
}
