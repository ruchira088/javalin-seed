[versions]
typesafe-config = "1.4.10"
javalin = "7.3.0"
javalin-openapi = "7.3.0"
logback = "1.6.8"
logstash-logback = "9.0"
jackson = "2.23.0"
micrometer = "1.18.0"
jspecify = "1.0.1"
errorprone = "2.53.0"
nullaway = "0.14.4"

junit = "6.1.3"
mockito = "5.25.0"

versions-plugin = "0.67.0"
spotbugs-plugin = "6.5.15"
spotless-plugin = "8.12.0"
errorprone-plugin = "5.2.0"
palantir-java-format = "2.103.0"
checkstyle = "14.4.0"
jacoco = "0.8.16"

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-testtools = { module = "io.javalin:javalin-testtools", version.ref = "javalin" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback" }
# Javalin core leaves the JSON library to the application; the BOM keeps every Jackson module on one version
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
micrometer-bom = { module = "io.micrometer:micrometer-bom", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
javalin-openapi-annotation-processor = { module = "io.javalin.community.openapi:openapi-annotation-processor", version.ref = "javalin-openapi" }
javalin-openapi-plugin = { module = "io.javalin.community.openapi:javalin-openapi-plugin", version.ref = "javalin-openapi" }
javalin-swagger-plugin = { module = "io.javalin.community.openapi:javalin-swagger-plugin", version.ref = "javalin-openapi" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# Not dependencies: these exist so Dependabot tracks the Checkstyle, JaCoCo and formatter tool versions
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
palantir-java-format = { module = "com.palantir.javaformat:palantir-java-format", version.ref = "palantir-java-format" }

[plugins]
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
