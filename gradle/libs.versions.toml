[versions]
typesafe-config = "1.4.9"
javalin = "7.2.3"
javalin-openapi = "7.2.3"
logback = "1.6.5"
logstash-logback = "9.0"

junit = "6.1.3"
mockito = "5.24.0"

versions-plugin = "0.66.0"
spotbugs-plugin = "6.5.13"
checkstyle = "14.3.0"
jacoco = "0.8.15"

[libraries]
javalin-bundle = { module = "io.javalin:javalin-bundle", version.ref = "javalin" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback" }
# Version managed by the Jackson BOM that javalin-bundle brings in
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8" }
javalin-openapi-annotation-processor = { module = "io.javalin.community.openapi:openapi-annotation-processor", version.ref = "javalin-openapi" }
javalin-openapi-plugin = { module = "io.javalin.community.openapi:javalin-openapi-plugin", version.ref = "javalin-openapi" }
javalin-swagger-plugin = { module = "io.javalin.community.openapi:javalin-swagger-plugin", version.ref = "javalin-openapi" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# Not dependencies: these exist so Dependabot tracks the Checkstyle and JaCoCo tool versions
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }

[plugins]
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
