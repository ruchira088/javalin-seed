- name: Install dependencies
  import_tasks: tasks/install-dependencies.yml

- name: Set config values and secrets
  no_log: true
  set_fact:
    config_values:
      MY_CONFIG_VALUE: my-sample-value
      APP_HOSTNAME: "{{ hostname }}"
      HTTP_ALLOWED_ORIGINS: "{{ allowed_origins | join(',') }}"
    secrets:
      MY_SECRET: my-passw0rd