# Fetches the kubeconfig named by `aws_ssm_k8s_config` into a fresh `k8s_output_dir` and exposes its path as `kubeconfig`.
- name: Create output directory
  block:
    - set_fact:
        k8s_output_dir: .k8s-output

    - name: Delete existing output directory
      file:
        path: "{{ k8s_output_dir }}"
        state: absent

    - name: Create directory
      file:
        path: "{{ k8s_output_dir }}"
        state: directory

- name: Setup K8s config
  block:
    - name: Set kubeconfig file location
      set_fact:
        kubeconfig: "{{ k8s_output_dir }}/kubeconfig"

    - name: Create K8s config file
      copy:
        dest: "{{ kubeconfig }}"
        content: "{{ lookup('aws_ssm', aws_ssm_k8s_config, region='ap-southeast-2') }}"
