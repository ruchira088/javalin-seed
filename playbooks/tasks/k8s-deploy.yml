- name: Install dependencies
  import_tasks: tasks/install-dependencies.yml

- name: Gather git information
  import_tasks: tasks/git-info.yml

- set_fact:
    ghcr_credentials: "{{ lookup('aws_ssm', '/github/ghcr/docker-config', region='ap-southeast-2') }}"

- name: Fetch the K8s config
  import_tasks: tasks/k8s-config.yml

- name: Render K8s resource files
  template:
    src: "{{ item }}"
    dest: "{{ k8s_output_dir }}/{{ item | basename }}"
  with_fileglob:
    - k8s/*.yaml

- name: Deploy K8s resources
  block:
    - name: Create Namespace
      command: "kubectl apply -f {{ k8s_output_dir }}/Namespace.yaml --kubeconfig {{ kubeconfig }}"

    - name: Create Docker registry secret
      command: "kubectl apply -f {{ k8s_output_dir }}/DockerRegistryCredentials.yaml --kubeconfig {{ kubeconfig }}"

    - name: Create data ConfigMap
      command: "kubectl apply -f {{ k8s_output_dir }}/DataConfigMap.yaml --kubeconfig {{ kubeconfig }}"

    - name: Create file ConfigMap
      command: "kubectl apply -f {{ k8s_output_dir }}/FileConfigMap.yaml --kubeconfig {{ kubeconfig }}"

    - name: Create Secrets
      command: "kubectl apply -f {{ k8s_output_dir }}/Secrets.yaml --kubeconfig {{ kubeconfig }}"

    - name: Deploy application
      command: "kubectl apply -f {{ k8s_output_dir }} --kubeconfig {{ kubeconfig }}"

    - name: Wait for successful deployment
      command: "kubectl rollout status deployment javalin-seed-deployment --kubeconfig {{ kubeconfig }} -n {{ k8s_namespace }}"

- name: Clean up output directory
  file:
    path: "{{ k8s_output_dir }}"
    state: absent